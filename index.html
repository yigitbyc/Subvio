<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#0A0A0B">
  <meta name="color-scheme" content="dark">
  <title>Subvio</title>
  <link rel="icon" href="assets/subvio-logo.png" type="image/png">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages/home.css">
  <link rel="stylesheet" href="css/pages/route.css">
  <link rel="stylesheet" href="css/pages/timer.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">İçeriğe geç</a>

  <div class="app-shell" id="app">
    <div class="nav-dock" id="nav-dock">
      <nav class="nav" id="nav" aria-label="Ana gezinme"></nav>
      <button class="fab" id="add-task-fab" type="button" aria-label="Görev ekle" aria-haspopup="dialog"></button>
    </div>

    <main class="app-main" id="main" tabindex="-1">
      <div class="view" id="view"></div>
    </main>
  </div>

  <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

  <noscript>Subvio çalışmak için JavaScript gerektirir.</noscript>
  <script>
    (function () {
      function showFallback(title, desc, detail) {
        var view = document.getElementById('view') || document.body;
        if (!view || view.querySelector('[data-subvio-fallback]')) return;
        view.innerHTML =
          '<div data-subvio-fallback="1" style="background:#18181C;border:1px solid rgba(255,122,26,0.35);border-radius:24px;padding:32px;max-width:520px;margin:48px auto;text-align:center;color:#fff;font-family:system-ui,sans-serif;box-shadow:0 20px 60px rgba(0,0,0,0.75);">' +
          '<h3 style="color:#FF7A1A;margin:0 0 10px;font-size:19px;font-weight:800;">' + title + '</h3>' +
          '<p style="color:#A0A0AB;font-size:14px;line-height:1.6;margin:0 0 18px;">' + desc + '</p>' +
          (detail ? '<pre style="text-align:left;background:#0A0A0B;color:#FF9E5E;padding:10px 12px;border-radius:10px;font-size:12px;overflow:auto;max-height:120px;margin:0 0 18px;">' + String(detail).replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '</pre>' : '') +
          '<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">' +
          '<button onclick="location.reload()" style="background:#FF7A1A;color:#0A0A0B;border:none;padding:11px 20px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;">Yeniden Dene</button>' +
          '<button onclick="localStorage.clear();location.hash=\'#/home\';location.reload();" style="background:rgba(255,255,255,0.08);color:#fff;border:1px solid rgba(255,255,255,0.14);padding:11px 20px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;">Verileri Sıfırla</button>' +
          '</div></div>';
      }

      if (location.protocol === 'file:') {
        showFallback(
          'Yerel Sunucu Gerekli',
          'Subvio modern tarayıcı modülleri (ES Modules) kullandığı için dosyayı doğrudan (file://) açmak yerine yerel sunucu üzerinden açmalısınız: <a href="http://127.0.0.1:5173/#/home" style="color:#FF7A1A;font-weight:700;">http://127.0.0.1:5173/#/home</a>'
        );
        return;
      }

      window.addEventListener('error', function (e) {
        console.error('Subvio Global Error:', e);
        var view = document.getElementById('view');
        if (view && view.children.length === 0) {
          var msg = (e && (e.message || (e.target && (e.target.src || e.target.href)))) || 'Bilinmeyen yükleme hatası';
          showFallback(
            'Uygulama Yüklenemedi',
            'Sayfa bileşenleri yüklenirken bir sorun oluştu. Tarayıcı önbelleğini yenileyin (Ctrl + F5) veya verileri sıfırlayarak tekrar deneyin.',
            msg
          );
        }
      }, true);

      window.addEventListener('unhandledrejection', function (e) {
        console.error('Subvio Promise Rejection:', e.reason);
        var view = document.getElementById('view');
        if (view && view.children.length === 0) {
          showFallback(
            'Uygulama Başlatılamadı',
            'Veriler işlenirken beklenmeyen bir hata oluştu.',
            e && e.reason ? (e.reason.message || e.reason) : ''
          );
        }
      });

      setTimeout(function () {
        var view = document.getElementById('view');
        if (view && view.children.length === 0) {
          showFallback(
            'Sayfa Yanıt Vermedi',
            'Uygulama modülleri yüklenemedi. Yerel sunucunun çalıştığından emin olup Ctrl + F5 ile sayfayı yenileyin.'
          );
        }
      }, 2000);
    })();
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
